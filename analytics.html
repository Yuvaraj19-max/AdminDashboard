
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analytics - AdminPanel</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="analytics.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>AdminPanel</h2>
            </div>

            <nav class="sidebar-nav">

                <a href="index.html">Dashboard</a>
                <a href="users.html">Users</a>
                <a href="analytics.html" class="active">Analytics</a>
                <a href="orders.html">Orders</a>
                <a href="products.html">Products</a>
                <a href="settings.html">Settings</a>

            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="top-navbar">
                <h2>Analytics</h2>
                <span>Welcome, Admin</span>
            </header>


            <section class="analytics-content">

                <div class="analytics-header">

                    <div>
                        <h1>Business Analytics</h1>
                        <p>Monitor your business performance.</p>
                    </div>

                    <select id="periodFilter">
                        <option value="monthly">Monthly Report</option>
                        <option value="yearly">Yearly Report</option>
                    </select>

                </div>


                <!-- Statistics Cards -->

                <div class="analytics-cards">

                    <article class="analytics-card">
                        <h3>Total Revenue</h3>
                        <p id="revenueValue">₹0</p>
                    </article>

                    <article class="analytics-card">
                        <h3>Total Sales</h3>
                        <p id="salesValue">0</p>
                    </article>

                    <article class="analytics-card">
                        <h3>Total Customers</h3>
                        <p id="customerValue">0</p>
                    </article>

                    <article class="analytics-card">
                        <h3>Average Revenue</h3>
                        <p id="averageValue">₹0</p>
                    </article>

                </div>


                <!-- Revenue Chart -->

                <div class="chart-container">

                    <h2>Revenue Overview</h2>

                    <div class="chart-box">
                        <canvas id="revenueChart"></canvas>
                    </div>

                </div>


                <!-- Sales and Customer Charts -->

                <div class="charts-grid">

                    <div class="chart-container">

                        <h2>Sales Performance</h2>

                        <div class="chart-box">
                            <canvas id="salesChart"></canvas>
                        </div>

                    </div>


                    <div class="chart-container">

                        <h2>Customer Growth</h2>

                        <div class="chart-box">
                            <canvas id="customerChart"></canvas>
                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Our JavaScript -->
    <script src="analytics.js"></script>

</body>
</html>
